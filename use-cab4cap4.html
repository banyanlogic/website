function doExport() {

  var url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  var a = document.createElement('a');
  a.href = url; a.download = 'cab4cap4-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  S.settings.exported = S.weeks.length; persist();
  if (view === 'data' || view === 'home') render();
}
function onFile(e) {

    try {
      var d = cleanData(JSON.parse(String(r.result)));
      pending = d;
      importMsg = 'Valid file: ' + d.weeks.length + ' week' + (d.weeks.length === 1 ? '' : 's') + ' and ' + d.caps.length + ' capabilit' + (d.caps.length === 1 ? 'y' : 'ies') + ', and ' + d.plan.rows.length + ' planner row' + (d.plan.rows.length === 1 ? '' : 's') + (d.weeks.length ? ' (' + d.weeks[0].date + ' to ' + d.weeks[d.weeks.length - 1].date + ')' : '') + '. Nothing is changed until you replace.' + migImportNote(d._mig);
    } catch (err) {
      importMsg = 'Rejected: ' + (err && err.message && err.message.length < 160 ? err.message.replace(/\.$/, '') : 'not a valid file') + '. Nothing was imported.';
    }

  };
  r.onerror = function () { importMsg = 'The file could not be read.'; render(); };
  r.readAsText(f);
}
